<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("xgimi-remote-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          var accent = localStorage.getItem("xgimi-remote-accent");
          var accents = ["amber", "blue", "teal", "green", "rose", "violet"];
          if (accents.indexOf(accent) === -1) accent = "amber";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.setAttribute("data-accent", accent);
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #07070a; color-scheme: dark; }
      html[data-theme="light"] { background: #f3efe6; color-scheme: light; }
    </style>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f0b43a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Horizon Remote" />
    <meta name="application-name" content="Horizon Remote" />
    <meta name="description" content="LAN remote for an XGIMI Horizon or other Android TV projector" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Horizon Remote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
